[project]
name = "sahel-malaria"
version = "0.1.0"
description = "Calibrated LOCO models for malaria RDT case-finding among afebrile children in Sahelian DHS/MIS surveys"
requires-python = ">=3.11"
dependencies = [
    "dbfread>=2.0.7",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyreadstat>=1.3.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]
